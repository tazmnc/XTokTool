name: Build XTokTool IPA (unsigned)

# Build IPA không cần chứng chỉ Apple: dùng CODE_SIGNING_ALLOWED=NO rồi
# đóng gói .app thành .ipa. File IPA này là UNSIGNED — cài lên iPhone thật
# cần ký lại bằng Apple ID miễn phí (AltStore / Sideloadly / Xcode) hoặc
# tài khoản Developer trả phí. Xem README.md mục "Cách lấy IPA".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Chọn Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Build app (không ký)
        run: |
          xcodebuild -project XTokTool.xcodeproj \
            -scheme XTokTool \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Đóng gói .ipa
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData/XTokTool-*/Build/Products/Release-iphoneos/XTokTool.app -maxdepth 0 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -path '*Release-iphoneos/XTokTool.app' -maxdepth 6 | head -n 1)
          fi
          echo "App tại: $APP_PATH"
          test -d "$APP_PATH" || (echo "Không tìm thấy XTokTool.app" && exit 1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r XTokTool-unsigned.ipa Payload
          ls -lh XTokTool-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: XTokTool-unsigned-ipa
          path: XTokTool-unsigned.ipa
          retention-days: 30
